version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    open-pull-requests-limit: 5
    labels: [ "dependencies" ]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
